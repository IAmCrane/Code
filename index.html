<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Code Snippets</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f6f8fa;
      color: #24292f;
    }
    h1 { border-bottom: 2px solid #d0d7de; padding-bottom: 8px; }
    .snippet-card {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      margin-bottom: 20px;
      padding: 16px;
    }
    .snippet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    pre {
      background: #0d1117;
      color: #e6edf3;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
    button {
      background-color: #2da44e;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #2c974b; }
  </style>
</head>
<body>

  <h1>My Code Snippets</h1>

  <!-- Snippet 1 -->
  <div class="snippet-card">
    <div class="snippet-header">
      <h3>Python: Read File</h3>
      <button onclick="copySnippet('code-1')">Copy Code</button>
    </div>
    <pre><code id="code-1">with open('file.txt', 'r') as f:
    content = f.read()
    print(content)</code></pre>
  </div>

  <!-- Snippet 2 -->
  <div class="snippet-card">
    <div class="snippet-header">
      <h3>JS: Fetch API Request</h3>
      <button onclick="copySnippet('code-2')">Copy Code</button>
    </div>
    <pre><code id="code-2">fetch('https://api.example.com/data')
  .then(res => res.json())
  .then(data => console.log(data));</code></pre>
  </div>

  <script>
    function copySnippet(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
      });
    }
  </script>

</body>
</html>
