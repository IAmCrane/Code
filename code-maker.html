<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Code Customizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f5f7;
            color: #333;
        }

        /* Control Panel Styles */
        .sidebar {
            width: 360px;
            background: #ffffff;
            border-right: 1px solid #e1e4e8;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            color: #111;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #444;
        }

        .control-group input[type="text"],
        .control-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .control-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .color-pickers {
            display: flex;
            gap: 16px;
        }

        .color-picker-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .color-picker-item input[type="color"] {
            width: 100%;
            height: 38px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        button.btn {
            padding: 10px 16px;
            background-color: #2da44e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn:hover {
            background-color: #2c974b;
        }

        /* Output & Preview Area */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
        }

        .preview-container {
            flex: 1;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .preview-header {
            background: #f6f8fa;
            padding: 10px 16px;
            border-bottom: 1px solid #e1e4e8;
            font-weight: 600;
            font-size: 0.85rem;
            color: #57606a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .code-container {
            height: 200px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background: #1e1e1e;
            overflow: hidden;
        }

        .code-header {
            background: #2d2d2d;
            padding: 8px 16px;
            color: #ccc;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-header button {
            background: #3c3c3c;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        textarea#generated-code {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 12px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.85rem;
            resize: none;
            outline: none;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Customizer Controls</h2>

        <div class="control-group">
            <label for="doc-title">Document Title</label>
            <input type="text" id="doc-title" value="Document">
        </div>

        <div class="control-group">
            <label for="heading-text">Main Heading</label>
            <input type="text" id="heading-text" value="My Website">
        </div>

        <div class="control-group">
            <label for="body-text">Welcome Message</label>
            <textarea id="body-text">Welcome to my website!</textarea>
        </div>

        <div class="control-group">
            <label for="footer-text">Footer Text</label>
            <input type="text" id="footer-text" value="My Website">
        </div>

        <div class="color-pickers">
            <div class="color-picker-item">
                <label for="bg-color">Background</label>
                <input type="color" id="bg-color" value="#ffffff">
            </div>
            <div class="color-picker-item">
                <label for="text-color">Text Color</label>
                <input type="color" id="text-color" value="#000000">
            </div>
        </div>

        <button class="btn" onclick="copyCode()">Copy HTML Code</button>
    </aside>

    <main class="workspace">
        <div class="preview-container">
            <div class="preview-header">Live Preview</div>
            <iframe id="preview-frame"></iframe>
        </div>

        <div class="code-container">
            <div class="code-header">
                <span>Generated Code</span>
                <button onclick="copyCode()">Copy</button>
            </div>
            <textarea id="generated-code" readonly></textarea>
        </div>
    </main>

    <script>
        const docTitle = document.getElementById('doc-title');
        const headingText = document.getElementById('heading-text');
        const bodyText = document.getElementById('body-text');
        const footerText = document.getElementById('footer-text');
        const bgColor = document.getElementById('bg-color');
        const textColor = document.getElementById('text-color');
        
        const previewFrame = document.getElementById('preview-frame');
        const generatedCode = document.getElementById('generated-code');

        function updateCode() {
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${docTitle.value}</title>
    <style>
        body {
            text-align: center;
            background-color: ${bgColor.value};
            color: ${textColor.value};
        }
    </style>
</head>
<body>
    <header>
        <h1>${headingText.value}</h1>
    </header>
    <main>
        <p>${bodyText.value}</p>
    </main>
    <footer>
        <p>&copy; ${new Date().getFullYear()} ${footerText.value}</p>
    </footer>
</body>
</html>`;

            generatedCode.value = html;
            previewFrame.srcdoc = html;
        }

        function copyCode() {
            generatedCode.select();
            navigator.clipboard.writeText(generatedCode.value);
            alert('Code copied to clipboard!');
        }

        // Event listeners for real-time updates
        docTitle.addEventListener('input', updateCode);
        headingText.addEventListener('input', updateCode);
        bodyText.addEventListener('input', updateCode);
        footerText.addEventListener('input', updateCode);
        bgColor.addEventListener('input', updateCode);
        textColor.addEventListener('input', updateCode);

        // Initial render
        updateCode();
    </script>
</body>
</html>
